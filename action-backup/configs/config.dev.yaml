# mac 开发用 simulation 配置。相对路径按运行时工作目录解析，请在工程根目录执行 make dev。
mode: "simulation"

server:
  listen: "127.0.0.1:8080"
  auth:
    enabled: false                # 开发时免登录；设为 true 并用 `action-backup passwd --config configs/config.dev.yaml` 设口令可测试登录

device:
  vendor_id: "0506"
  product_id: "8002"
  auto_detect: true
  auto_backup: false              # 开发时手动触发
  readonly: true

simulation:
  device_source: "fixtures"       # fixtures | volumes | both
  fixtures:
    devices:
      - key: "sim-cam-1"
        serial: "SIM0001"
        name: "Simulated Osmo Action 5 Pro"
        volumes:
          - type: "internal"
            path: "./tests/fixtures/cam1/internal"
          - type: "sdcard"
            path: "./tests/fixtures/cam1/sdcard"
    attached_on_start: true
  volumes:                        # 读取 mac 自动挂载的真相机（V0.2）
    poll_interval_sec: 2
    match_by: "usb_vid_pid"
  allow_local_destination: true

backup:
  include_internal: true
  include_sdcard: true
  source_directory: "DCIM"
  file_extensions: [".mp4"]
  worker_count: 1
  buffer_size_mb: 4
  retry_count: 3
  checkpoint_interval_sec: 2
  checkpoint_bytes_mb: 16
  verify_mode: "sha256"
  delete_source: false

storage:
  type: "local"                   # 改为 premounted 即可写 Finder 挂载的真 NAS
  local_root: "./dev/nas"
  # premounted 示例：
  # type: "premounted"
  # mount_point: "/Volumes/VideoBackup"
  # share: "//192.168.1.100/VideoBackup"
  destination_root: "DJI-Action5Pro-TEST"
  destination_layout: "{volume_type}/{relative_path}"

faults:
  enabled: true
  rules: []                       # 也可运行时通过 /api/v1/test/faults 添加（V0.4）

database:
  path: "./dev/backup-dev.db"

notifications:                  # 开发时默认关闭；要试推送就在网页「设置 → 通知」里填昵称并打开
  enabled: false
  on: { device_attached: true, backup_started: true, backup_finished: true, backup_failed: true }
  meow: { enabled: false, nickname: "" }
  telegram: { enabled: false, bot_token: "", chat_id: "", proxy_url: "" }

logging:
  level: "debug"
  format: "text"
