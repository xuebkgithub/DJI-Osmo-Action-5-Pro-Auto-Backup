# 实机 dry-run 配置。与 production 相同，仅 mode 不同。
mode: "dry-run"               # 实机首轮验证：只扫描、规划，不写 NAS

server:
  listen: "0.0.0.0:8080"
  auth:
    enabled: false              # dry-run 只读接口；切换 production 前必须开启并用 action-backup passwd 设置口令
    username: "admin"
    password_hash: ""
    session_ttl_hours: 24
    login_rate_limit_per_min: 5

device:
  vendor_id: "0506"
  product_id: "8002"
  auto_detect: true
  auto_backup: true
  mount_root: "/run/action-backup-mounter/source"   # 由 action-backup-mounter 守护只读挂载，<mount_root>/sdX
  readonly: true

backup:
  include_internal: true
  include_sdcard: true
  source_directory: "DCIM"
  file_extensions:
    - ".mp4"
  ignore_patterns:
    - "._*"
    - ".DS_Store"
    - ".Spotlight-V100"
    - ".fseventsd"
    - ".Trashes"
    - "System Volume Information"
  worker_count: 1
  buffer_size_mb: 4
  retry_count: 3
  checkpoint_interval_sec: 30   # 每个检查点 fsync 一次；实机 CIFS 上 5 s / 64 MB 把吞吐压到 24 MB/s，512 MB 为 66 MB/s
  checkpoint_bytes_mb: 512
  verify_mode: "basic"
  delete_source: false

storage:
  type: "cifs"                  # cifs | premounted | local
  share: "//192.168.1.100/VideoBackup"
  mount_point: "/mnt/action-backup-nas"
  smb_version: "auto"           # auto = 协商 2.1 到 3.1.1；或固定 "3.1.1"
  credentials_file: "/etc/action-backup/smb.credentials"
  destination_root: "DJI-Action5Pro"
  destination_layout: "{volume_type}/{relative_path}"

database:
  path: "/var/lib/action-backup/backup.db"

notifications:                  # 推送通知；网页「设置 → 通知」可在线修改，改动写回本文件
  enabled: false
  site_url: ""                  # 通知里附带的网页链接，如 http://172.20.31.6:8080；留空不附
  on:
    device_attached: true
    backup_started: true
    backup_finished: true       # 一批任务全部结束后发一条汇总
    backup_failed: true         # 失败 / 中断，30 秒内合并
  meow:                         # https://www.chuckfang.com/MeoW/ ；设备可直连 api.chuckfang.com
    enabled: false
    nickname: ""
  telegram:                     # 设备直连不到 api.telegram.org，需填 proxy_url
    enabled: false
    bot_token: ""
    chat_id: ""
    proxy_url: ""               # http://host:port 或 socks5://host:port

logging:
  level: "info"
  format: "json"
