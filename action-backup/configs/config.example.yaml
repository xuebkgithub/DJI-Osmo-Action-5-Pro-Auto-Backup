# 实机 production 配置。安装路径：/etc/action-backup/config.yaml
mode: "production"            # production | dry-run | simulation

server:
  listen: "0.0.0.0:8080"
  auth:
    enabled: true
    username: "admin"
    password_hash: "$2a$12$REPLACE_WITH_OUTPUT_OF_action-backup_passwd_____________"
    session_ttl_hours: 24
    login_rate_limit_per_min: 5

device:
  vendor_id: "0506"
  product_id: "8002"
  auto_detect: true
  auto_backup: true
  mount_root: "/run/action-backup-mounter/source"   # 由 action-backup-mounter 守护只读挂载，<mount_root>/sdX
  readonly: true

backup:
  include_internal: true
  include_sdcard: true
  source_directory: "DCIM"
  file_extensions:
    - ".mp4"
  ignore_patterns:
    - "._*"
    - ".DS_Store"
    - ".Spotlight-V100"
    - ".fseventsd"
    - ".Trashes"
    - "System Volume Information"
  worker_count: 1
  buffer_size_mb: 4
  retry_count: 3
  checkpoint_interval_sec: 30   # 每个检查点 fsync 一次；实机 CIFS 上 5 s / 64 MB 把吞吐压到 24 MB/s，512 MB 为 66 MB/s
  checkpoint_bytes_mb: 512
  verify_mode: "basic"
  delete_source: false

storage:
  type: "cifs"                  # cifs | premounted | local
  share: "//192.168.1.100/VideoBackup"
  mount_point: "/mnt/action-backup-nas"
  smb_version: "auto"           # auto = 协商 2.1 到 3.1.1；或固定 "3.1.1"
  credentials_file: "/etc/action-backup/smb.credentials"
  # NAS 不可用时可改为本地目录目标（显式开关，默认禁止）：
  #   type: "local"
  #   local_root: "/var/lib/action-backup/local-target"   # 必须在服务可写路径内（见 action-backup.service ReadWritePaths）
  #   allow_local_destination: true
  destination_root: "DJI-Action5Pro"
  destination_layout: "{volume_type}/{relative_path}"

database:
  path: "/var/lib/action-backup/backup.db"

logging:
  level: "info"
  format: "json"
